# Extra flags for the tailscaled service.
#
# Applied by $PREFIX/var/service/tailscaled/run. Restart after editing:
#     sv restart tailscaled
#
# TAILSCALED_ARGS="--port=41641"

# A SOCKS5 proxy lets other apps route traffic through your tailnet:
#
#     TAILSCALED_ARGS="--socks5-server=localhost:1055"
#
# Understand what that does before enabling it. Android does not isolate the
# loopback interface per app, so every app on this device that holds the
# INTERNET permission can reach 127.0.0.1:1055 and get egress into your
# tailnet as this node -- private hosts, subnet routes and your exit node
# included. Upstream tailscaled has no authentication for this proxy.
#
# If you need an authenticated proxy, github.com/bropines/tailscale-termux-cli
# patches one in and generates credentials for you.
