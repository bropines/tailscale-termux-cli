name: Build and Release Tailscale for Termux (Android 11+)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ts_version:
        description: 'Tailscale Version (e.g., v1.96.5)'
        required: true
        default: 'v1.96.5'
  workflow_call:
    inputs:
      ts_version:
        description: 'Tailscale Version (e.g., v1.96.5)'
        required: true
        type: string

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm, i686, x86_64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Cache Go build & module caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.arch }}-${{ hashFiles('build.sh', 'build_deb.sh', 'patches/*') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.arch }}-
            ${{ runner.os }}-go-

      - name: Build Binaries and Deb Package
        env:
          TS_VERSION: ${{ inputs.ts_version || github.event.inputs.ts_version || github.ref_name }}
        run: |
          chmod +x ./build_deb.sh ./build.sh
          ./build_deb.sh ${{ matrix.arch }}

      - name: Upload Artifacts for ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.arch }}
          path: |
            bin/tailscale-*
            bin/tailscaled-*
            dist/*.deb

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all matrix artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          find artifacts/ -type f \( -name "tailscale-*" -o -name "tailscaled-*" -o -name "*.deb" \) -exec cp {} release_assets/ \;
          echo "Release assets prepared:"
          ls -la release_assets/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.ts_version || github.event.inputs.ts_version || github.ref_name }}
          files: release_assets/*
          body: |
            Patched Tailscale binaries and .deb packages for Termux (Android 11+).
            Based on Tailscale ${{ inputs.ts_version || github.event.inputs.ts_version || github.ref_name }}.
            Featuring Netmon Patch (ifconfig parser), auto-socket resolution, and daemon auto-start helper.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Combined Artifacts
        if: ${{ ! (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-termux-cli-binaries
          path: release_assets/*

