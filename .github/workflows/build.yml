name: Build and Release Tailscale for Termux (Android 11+)

on:
  push:
    tags:
      - 'v*'
  # Build (but never publish) on PRs. The repository had no PR check at all,
  # which is how three architectures shipped for months without the netmon
  # patch: build.sh's verify_patched now fails that build instead.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ts_version:
        description: 'Tailscale Version (e.g., v1.96.5)'
        required: true
        default: 'v1.96.5'
  workflow_call:
    inputs:
      ts_version:
        description: 'Tailscale Version (e.g., v1.96.5)'
        required: true
        type: string

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm, i686, x86_64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Without tags `git describe` falls back to a bare commit hash,
          # which is not a usable package version.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Cache Go build & module caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.arch }}-${{ hashFiles('build.sh', 'build_deb.sh', 'patches/*') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.arch }}-
            ${{ runner.os }}-go-

      # Go refuses GOOS=android without cgo on arm/386/amd64, so those need the
      # NDK's C compiler. Runners ship one; fail loudly here rather than deep
      # inside the build if that ever changes.
      - name: Locate Android NDK
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "::error::No Android NDK on this runner."
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK"
          ls "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/" | grep -c 'android24-clang$' \
            | sed 's/^/api24 clang wrappers: /'

      - name: Build Binaries and Deb Package
        env:
          TS_VERSION: ${{ inputs.ts_version || github.event.inputs.ts_version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          chmod +x ./build_deb.sh ./build.sh
          ./build_deb.sh ${{ matrix.arch }}

      - name: Upload Artifacts for ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.arch }}
          path: |
            bin/tailscale-*
            bin/tailscaled-*
            dist/*.deb
            dist/*.pkg.tar.xz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all matrix artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          find artifacts/ -type f \( -name "tailscale-*" -o -name "tailscaled-*" -o -name "*.deb" -o -name "*.pkg.tar.xz" \) -exec cp {} release_assets/ \;
          # BSD-3 clause 2 asks for the notice to travel with binary
          # distributions; the loose binaries here are not inside a package.
          cp LICENSE release_assets/LICENSE
          # The public half of the package signing key, so it can be imported
          # straight from the release as well as from the repository.
          cp keys/tailscale-termux-cli.asc release_assets/

      # pacman refuses `pacman -U <URL>` unless a detached .sig sits next to
      # the package, so publish one. Signing must happen before SHA256SUMS is
      # written, or the signatures would not be covered by it.
      - name: Sign pacman packages
        env:
          GPG_PRIVATE_KEY: ${{ secrets.PACMAN_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.PACMAN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::warning::No signing key configured; pacman packages published unsigned."
            echo "pacman -U <URL> will not work without a .sig beside the package."
            exit 0
          fi
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME; chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          for f in release_assets/*.pkg.tar.xz; do
            # Detached and binary, which is the form pacman looks for.
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                --detach-sign --no-armor --output "$f.sig" "$f"
            gpg --verify "$f.sig" "$f"
            echo "signed $(basename "$f")"
          done
          gpgconf --kill all || true
          rm -rf "$GNUPGHOME"

      - name: Generate checksums
        run: |
          # remote-install.sh and tailscale-update pull these assets over plain
          # HTTPS with nothing else to verify them against.
          ( cd release_assets && sha256sum ./* > SHA256SUMS )
          echo "Release assets prepared:"
          ls -la release_assets/
          cat release_assets/SHA256SUMS

      # A reusable workflow inherits the CALLER's event, so on the nightly
      # check-updates run github.event_name is "schedule" and github.ref is
      # "refs/heads/main" -- every disjunct of the old condition was false and
      # the release step silently skipped while the job still reported success.
      # inputs.ts_version is populated on both workflow_call and
      # workflow_dispatch, and empty on a tag push.
      - name: Decide whether to publish
        id: gate
        env:
          TS_VERSION_INPUT: ${{ inputs.ts_version }}
        run: |
          if [ -n "$TS_VERSION_INPUT" ] || [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        if: steps.gate.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.ts_version || github.event.inputs.ts_version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          files: release_assets/*
          body: |
            Patched Tailscale binaries and .deb packages for Termux (Android 11+).
            Based on Tailscale ${{ inputs.ts_version || github.event.inputs.ts_version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}.
            Featuring Netmon Patch (ifconfig parser), auto-socket resolution, and daemon auto-start helper.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Combined Artifacts
        if: steps.gate.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-termux-cli-binaries
          path: release_assets/*

